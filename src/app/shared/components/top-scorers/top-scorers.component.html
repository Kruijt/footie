@if (topScorers$ | async; as topScorers) {
    @if (topScorers.length) {
        <div class="card-row">
            <mat-card>
                <mat-card-content>
                    <mat-accordion>
                        <mat-expansion-panel (expandedChange)="panelToggled.next($event)">
                            <mat-expansion-panel-header>
                                <mat-panel-title class="b-fx b-fx-start-center b-fx-gap-4">
                                    <mat-icon class="b-fx-none">sports_soccer</mat-icon>
                                    <span>Top scorers</span>
                                </mat-panel-title>

                                @if (topScorer$ | async; as topScorer) {
                                    <mat-panel-description class="b-fx b-fx-end-center b-fx-gap-4">
                                        <mat-icon>elderly</mat-icon>
                                        <span>{{ topScorer.name }} ({{ topScorer.goals }}) </span>
                                    </mat-panel-description>
                                }
                            </mat-expansion-panel-header>

                            <table mat-table [dataSource]="topScorers">
                                <tr mat-row *matRowDef="let row; columns: ['ranking', 'name', 'goals']"></tr>

                                <ng-container matColumnDef="ranking">
                                    <td mat-cell *matCellDef="let player; let i = index">#{{ i + 1 }}</td>
                                </ng-container>

                                <ng-container matColumnDef="name">
                                    <td mat-cell *matCellDef="let player">
                                        {{ player?.name }}
                                    </td>
                                </ng-container>

                                <ng-container matColumnDef="goals">
                                    <td mat-cell *matCellDef="let player">
                                        <div class="b-fx b-fx-end-center b-fx-gap-24">
                                            <span>
                                                {{ player?.goals }}
                                            </span>

                                            <div class="b-fx">
                                                <button mat-icon-button class="success" (click)="onAddGoal(player)">
                                                    <mat-icon>stat_1</mat-icon>
                                                </button>

                                                <button mat-icon-button class="alert" (click)="onRemoveGoal(player)">
                                                    <mat-icon>stat_minus_1</mat-icon>
                                                </button>
                                            </div>
                                        </div>
                                    </td>
                                </ng-container>
                            </table>
                        </mat-expansion-panel>
                    </mat-accordion>
                </mat-card-content>
            </mat-card>
        </div>
    }
}
